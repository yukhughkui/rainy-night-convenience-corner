import * as THREE from 'three';

/* =========================================================
   helpers
========================================================= */
const L = (a,b,t)=>a+(b-a)*t;
const RAND = (a,b)=>a+Math.random()*(b-a);
const ss = (a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};

function makeGradient(steps){
  const data = new Uint8Array(steps*4);
  for(let i=0;i<steps;i++){
    const v = Math.floor(255*i/(steps-1));
    data[i*4]=v; data[i*4+1]=v; data[i*4+2]=v; data[i*4+3]=255;
  }
  const t = new THREE.DataTexture(data, steps, 1, THREE.RGBAFormat);
  t.minFilter = THREE.NearestFilter; t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
}
const GRAD = makeGradient(4);

const _tc = new Map();
function T(color, opt={}){
  const m = new THREE.MeshToonMaterial({color});
  m.gradientMap = GRAD;
  if(opt.transparent){ m.transparent = true; m.opacity = opt.opacity; }
  if(opt.emissive){ m.emissive = opt.emissive; m.emissiveIntensity = opt.emissiveIntensity ?? 1; }
  if(opt.emissiveMap){ m.emissiveMap = opt.emissiveMap; m.emissive = opt.emissive ?? 0xffffff; m.emissiveIntensity = opt.emissiveIntensity ?? 1; }
  if(opt.depthWrite===false) m.depthWrite = false;
  if(opt.emissiveMap) return m;   // texture-bound materials must not be cached
  const key = color + '|' + (opt.transparent?1:0) + (opt.opacity||0) + (opt.emissive||0) + (opt.emissiveIntensity||0);
  if(_tc.has(key)) return _tc.get(key);
  _tc.set(key, m);
  return m;
}

const _oc = new Map();
function OM(color){
  if(_oc.has(color)) return _oc.get(color);
  const m = new THREE.MeshBasicMaterial({color, side:THREE.BackSide});
  _oc.set(color, m); return m;
}
function outlineOf(mesh, size=0.022, color=0x12151d){
  if(!mesh.geometry.attributes.normal) return null;
  const g = mesh.geometry.clone();
  const p = g.attributes.position, n = g.attributes.normal;
  for(let i=0;i<p.count;i++){
    p.setXYZ(i, p.getX(i)+n.getX(i)*size, p.getY(i)+n.getY(i)*size, p.getZ(i)+n.getZ(i)*size);
  }
  const o = new THREE.Mesh(g, OM(color));
  o.position.copy(mesh.position); o.rotation.copy(mesh.rotation); o.scale.copy(mesh.scale);
  return o;
}
function addO(mesh, size, color){
  const o = outlineOf(mesh, size, color);
  if(o) mesh.parent.add(o);
  return mesh;
}

function texCanvas(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  draw(ctx, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

function box(w,h,d,mat,x=0,y=0,z=0){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); return m;
}
function cyl(rt,rb,h,mat,x=0,y=0,z=0,seg=10){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.position.set(x,y,z); return m;
}
function plane(w,h,mat,x=0,y=0,z=0){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), mat);
  m.position.set(x,y,z); return m;
}
function cylinderBetween(a, b, r, mat){
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 8), mat);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
  return m;
}
function flatDecal(w,h,mat,x,y,z,ry=0){
  const m = plane(w,h,mat,x,y,z);
  m.rotation.x = -Math.PI/2;
  if(ry) m.rotation.z = ry;
  m.receiveShadow = true;
  return m;
}
function puddle(x,z,rx,rz,y=0.048){
  const geo = new THREE.CircleGeometry(1, 22);
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color:0x0c1017, roughness:0.08, metalness:0.45, transparent:true, opacity:0.92
  }));
  m.position.set(x, y, z);
  m.rotation.x = -Math.PI/2;
  m.scale.set(rx, rz, 1);
  m.receiveShadow = true;
  return m;
}

function vendingTex(body, tint){

    for(let i=0;i<20;i++){
      const cx = 32 + (i%4)*64, cy = 112 + Math.floor(i/4)*80;

      c.fillStyle = '#0e1116'; c.fillRect(cx-16, cy-30, 32, 12);

}

    c.font = 'bold 22px sans-serif'; c.fillText(t2, w/2, 108);
  });
}

const streakCanvas = document.createElement('canvas');
streakCanvas.width = 256; streakCanvas.height = 512;
const sctx = streakCanvas.getContext('2d');
const streakTex = new THREE.CanvasTexture(streakCanvas);
streakTex.colorSpace = THREE.SRGBColorSpace;
const streakDrops = [];
for(let i=0;i<26;i++) streakDrops.push({x:Math.random(), y:Math.random(), len:RAND(0.05,0.16), v:RAND(0.02,0.06), w:RAND(1,2.6)});
const streakDots = [];
for(let i=0;i<30;i++) streakDots.push({x:Math.random(), y:Math.random(), r:RAND(0.6,2.2), a:RAND(0.15,0.4)});
function updateStreaks(dt){
  sctx.clearRect(0,0,256,512);
  for(const d of streakDots){
    sctx.globalAlpha = d.a;
    sctx.fillStyle = '#dce7ff';
    sctx.beginPath(); sctx.arc(d.x*256, d.y*512, d.r, 0, Math.PI*2); sctx.fill();
  }
  sctx.globalAlpha = 1;
  for(const d of streakDrops){
    d.y += d.v*dt;
    if(d.y - d.len > 1.05){ d.y = RAND(-0.3,0); d.x = Math.random(); }
    const g = sctx.createLinearGradient(0,(d.y-d.len)*512,0,d.y*512);
    g.addColorStop(0,'rgba(205,225,255,0)');
    g.addColorStop(1,'rgba(215,232,255,0.55)');
    sctx.strokeStyle = g; sctx.lineWidth = d.w;
    sctx.beginPath(); sctx.moveTo(d.x*256,(d.y-d.len)*512); sctx.lineTo(d.x*256,d.y*512); sctx.stroke();
    sctx.fillStyle = 'rgba(235,244,255,0.7)';
    sctx.beginPath(); sctx.arc(d.x*256, d.y*512, d.w*0.9, 0, Math.PI*2); sctx.fill();
  }
  streakTex.needsUpdate = true;
}
const streakMat = new THREE.MeshBasicMaterial({map:streakTex, transparent:true, opacity:0.5, blending:THREE.AdditiveBlending, depthWrite:false});
function streakPlane(w,h,x,y,z,ry){
  const p = plane(w,h,streakMat,x,y,z);
  if(ry) p.rotation.y = ry;
  p.renderOrder = 2;
  return p;
}

/* utility poles + wires */
const wireMat = new THREE.LineBasicMaterial({color:0x14161c, transparent:true, opacity:0.85});
function wire(a, b, sag){
  const pts = [];
  for(let i=0;i<=14;i++){
    const t = i/14;
    const p = new THREE.Vector3().lerpVectors(a, b, t);
    p.y -= sag * 4 * t * (1-t);
    pts.push(p);
  }
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  return new THREE.Line(g, wireMat);
}
function makePole(x, z){
  const g = new THREE.Group();
  const pole = cyl(0.1, 0.13, 6.3, T(0x3a4048), x, 3.31, z);
  pole.castShadow = true;
  g.add(pole); g.add(outlineOf(pole));
  const arm1 = cylinderBetween(new THREE.Vector3(x-1.1,5.9,z), new THREE.Vector3(x+1.1,5.9,z), 0.045, T(0x3a4048));
  g.add(arm1);
  const arm2 = cylinderBetween(new THREE.Vector3(x-0.7,6.1,z), new THREE.Vector3(x+0.7,6.1,z), 0.04, T(0x3a4048));
  g.add(arm2);
  [[-1.1],[-0.45],[0.7]].forEach(([ox])=>{
    const ins = box(0.08, 0.14, 0.08, T(0x5d626b), x+ox, 6.15, z);
    g.add(ins);
  });
  root.add(g);
  return {x, z, top:new THREE.Vector3(x, 6.1, z)};
}

const railMat = T(0xe7e9ec);
function guardrail(x1,z1,x2,z2,n=4){
  const g = new THREE.Group();
  const dx = x2-x1, dz = z2-z1;
  const len = Math.hypot(dx,dz);
  const ang = Math.atan2(-dz, dx);
  for(let i=0;i<=n;i++){
    const t = i/n;
    const post = box(0.06, 0.95, 0.06, railMat, L(x1,x2,t), 0.635, L(z1,z2,t));
    post.castShadow = true;
    g.add(post);
  }
  [0.6, 0.88].forEach(y=>{
    const rail = box(len+0.1, 0.05, 0.05, railMat, (x1+x2)/2, 0.16+y, (z1+z2)/2);
    rail.rotation.y = ang;
    rail.castShadow = true;
    g.add(rail); g.add(outlineOf(rail, 0.012));
  });
  root.add(g);
}

const pools = [];
function makePool(x, z, w, d, color, opacity, ry=0, y=0.055){

}

// wet reflective streaks on road
function streak(x, z, w, d, color, op, ry=0){
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const x2 = c.getContext('2d');
  const g = x2.createLinearGradient(0,0,256,0);
  g.addColorStop(0,'rgba(255,255,255,0)');
  g.addColorStop(0.5,'rgba(255,255,255,0.9)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x2.fillStyle = g; x2.fillRect(0,0,256,64);
  const t = new THREE.CanvasTexture(c);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,d),
    new THREE.MeshBasicMaterial({map:t, color, transparent:true, opacity:op, blending:THREE.AdditiveBlending, depthWrite:false}));
  m.rotation.x = -Math.PI/2;
  m.position.set(x, 0.05, z);
  if(ry) m.rotation.z = ry;
  root.add(m);
  return m;
}

/* =========================================================

  rainPos[i*3]   = RAND(-13.5, 13.5);

for(let i=0;i<12;i++){

function spawnRipple(x, z, y=0.06){
  const r = ripples[(Math.random()*ripples.length)|0];
  r.x = x; r.z = z; r.y = y;
  r.mesh.position.set(x, y, z);
  r.offset = -((elapsed)*r.speed)%1;
}

const dropGeo = new THREE.SphereGeometry(0.028, 6, 6);

for(let i=0;i<30;i++){
  const m = new THREE.Mesh(dropGeo, dropMat);
  m.visible = false;
  root.add(m);

let dropIdx = 0;
function spawnDrop(ox, oy, oz){
  const d = drops[dropIdx];
  dropIdx = (dropIdx+1)%drops.length;
  d.active = true;
  d.x = ox; d.y = oy; d.z = oz;
  d.vy = RAND(0.1, 0.5);
  d.mesh.visible = true;
  d.mesh.position.set(ox, oy, oz);
}

/* =========================================================
   animation
========================================================= */
const flickerMats = [roofSignMat, vertSignMat, ...vendMats];
let flickerT = 0;
const clock = new THREE.Clock();
let elapsed = 0;

function animate(){
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  const t = elapsed;

  // rain
  const arr = rainGeo.attributes.position.array;
  for(let i=0;i<RAIN_N;i++){
    arr[i*3+1] -= rainSpeed[i]*dt;
    arr[i*3]   -= dt*0.25;
    if(arr[i*3+1] < 0.02){
      arr[i*3+1] = RAND(11, 13);
      arr[i*3] = RAND(-13.5, 13.5);
      arr[i*3+2] = RAND(-13.5, 13.5);
    }
  }
  rainGeo.attributes.position.needsUpdate = true;

  // glass streaks
  updateStreaks(dt);

  // ripples
  for(const r of ripples){
    const k = (t*r.speed + r.offset)%1;
    r.mesh.visible = k > 0.04;
    if(r.mesh.visible){
      const s = 0.15 + 1.05*k;
      r.mesh.scale.set(s, s, 1);
      r.mesh.material.opacity = 0.42*(1-k)*(1-k);
    }
  }

  // drips
  for(const o of dripOrigins){
    o.next -= dt;
    if(o.next <= 0){
      spawnDrop(o.x, o.y, o.z);
      o.next = RAND(0.25, 1.9);
    }
  }
  for(const d of drops){
    if(!d.active) continue;
    d.vy -= 14*dt;
    d.y += d.vy*dt;
    if(d.y <= 0.17){
      d.active = false;
      d.mesh.visible = false;
      spawnRipple(d.x, d.z, 0.165);
    } else {
      d.mesh.position.y = d.y;
    }
  }

  // automatic door
  const tc = t % 15;
  const open = ss(10.0, 10.7, tc) * (1 - ss(12.2, 12.9, tc));
  for(const dp of doorPanels){
    dp.panel.position.x = dp.side * (0.45 + 0.9*open);
  }

  // sign / lightbox flicker
  flickerT -= dt;
  if(Math.random() < 0.0015) flickerT = 0.05 + Math.random()*0.12;
  const fk = flickerT > 0 ? (0.25 + Math.random()*0.5) : 1;
  for(const m of flickerMats) m.emissiveIntensity = fk * (m.userData.base ?? 1);

  // traffic light cycle
  const t16 = t % 16;
  let activeLens = null;
  if(t16 < 7){ activeLens = tlGre; }
  else if(t16 < 8.4){ activeLens = tlYel; }
  else { activeLens = tlRed; }
  const lensDef = [[tlRed,0xff4a3d],[tlYel,0xffc93d],[tlGre,0x3dd66a]];
  for(const [m, col] of lensDef){
    m.color.setHex(m===activeLens ? col : 0x22262e);
  }
  const trafficCol = activeLens===tlRed ? 0xff4a3d : (activeLens===tlYel ? 0xffc93d : 0x3dd66a);
  trafficLightPoint.color.setHex(trafficCol);
  trafficLightPoint.intensity = activeLens ? 0.55 : 0.25;

  // pool shimmer
  for(const p of pools){
    const doorF = (p === doorPool) ? (0.35 + 0.65*open) : 1;
    p.mesh.material.opacity = p.base * doorF * (0.92 + 0.08*Math.sin(t*2.1 + p.phase));
  }

  controls.update();
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

window.__debug = {renderer, scene, camera};
