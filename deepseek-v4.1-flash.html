<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>雨夜便利店 · 街角微缩模型</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #04060b;
    -webkit-user-select: none; user-select: none;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #app canvas:active { cursor: grabbing; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 42%, rgba(0,0,0,.28) 76%, rgba(0,0,0,.6) 100%);
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   基础
   ============================================================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a1220, 0.0125);

const camera = new THREE.PerspectiveCamera(41, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(9.8, 8.9, 14.3);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-3.8, 1.9, -3.9);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.rotateSpeed = 0.62;
controls.zoomSpeed = 0.8;
controls.enablePan = false;
controls.minDistance = 9;
controls.maxDistance = 42;
controls.minPolarAngle = 0.16;
controls.maxPolarAngle = 1.47;
controls.update();

const clock = new THREE.Clock();
const updaters = [];
const onUpdate = (fn) => updaters.push(fn);

/* 三渲二渐变 */
const gradientMap = new THREE.DataTexture(new Uint8Array([42, 118, 196, 255]), 4, 1, THREE.RedFormat);
gradientMap.minFilter = gradientMap.magFilter = THREE.NearestFilter;
gradientMap.needsUpdate = true;

const outlineMat = new THREE.MeshBasicMaterial({ color: 0x080b13, side: THREE.BackSide });
const world = new THREE.Group();
scene.add(world);

/* ============================================================
   工具
   ============================================================ */
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const TAU = Math.PI * 2;

function makeCanvas(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  return c;
}

function canvasTex(w, h, draw, opts = {}) {
  const tex = new THREE.CanvasTexture(makeCanvas(w, h, draw));
  tex.colorSpace = opts.linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if (opts.repeat) {
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(opts.repeat[0], opts.repeat[1]);
  }
  return tex;
}

function repeatTex(tex, x, y) {
  const t = tex.clone();
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(x, y);
  t.needsUpdate = true;
  return t;
}

function toon(color, opts = {}) {
  return new THREE.MeshToonMaterial({ color, gradientMap, ...opts });
}
function basic(color, opts = {}) {
  return new THREE.MeshBasicMaterial({ color, ...opts });
}
function std(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, envMapIntensity: 0.8, ...opts });
}

function addOutline(mesh, scale = 1.03) {
  const o = new THREE.Mesh(mesh.geometry, outlineMat);
  o.scale.setScalar(scale);
  o.castShadow = false;
  o.receiveShadow = false;
  mesh.add(o);
  return mesh;
}

function box(w, h, d, mat, x, y, z, opts = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = opts.cast !== false;
  m.receiveShadow = opts.receive !== false;
  if (opts.rx) m.rotation.x = opts.rx;
  if (opts.ry) m.rotation.y = opts.ry;
  if (opts.rz) m.rotation.z = opts.rz;
  (opts.parent || world).add(m);
  if (opts.outline) addOutline(m, opts.outline);
  return m;
}

function cyl(rt, rb, h, seg, mat, x, y, z, opts = {}) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z);
  m.castShadow = opts.cast !== false;
  m.receiveShadow = opts.receive !== false;
  if (opts.rx) m.rotation.x = opts.rx;
  if (opts.ry) m.rotation.y = opts.ry;
  if (opts.rz) m.rotation.z = opts.rz;
  (opts.parent || world).add(m);
  if (opts.outline) addOutline(m, opts.outline);
  return m;
}

function plane(w, h, mat, x, y, z, opts = {}) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z);
  m.rotation.x = opts.rx !== undefined ? opts.rx : 0;
  m.rotation.y = opts.ry || 0;
  m.rotation.z = opts.rz || 0;
  m.castShadow = false;
  m.receiveShadow = opts.receive || false;
  (opts.parent || world).add(m);
  return m;
}

function tube(a, b, r, mat, parent = world, radial = 6) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, radial), mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

/* 光晕贴图 */
const glowTexture = canvasTex(128, 128, (ctx) => {
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.18, 'rgba(255,255,255,.72)');
  g.addColorStop(0.46, 'rgba(255,255,255,.18)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
});
function glow(color, size, opacity = 0.5, parent = world) {
  const mat = new THREE.SpriteMaterial({
    map: glowTexture, color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const s = new THREE.Sprite(mat);
  s.scale.set(size, size, 1);
  parent.add(s);
  return s;
}

/* ============================================================
   背景 / 环境反射
   ============================================================ */
scene.background = canvasTex(1024, 1024, (ctx, w, h) => {
  ctx.fillStyle = '#03050a';
  ctx.fillRect(0, 0, w, h);
  let g = ctx.createRadialGradient(w * .48, h * .42, 40, w * .48, h * .42, w * .78);
  g.addColorStop(0, '#1d3050');
  g.addColorStop(0.36, '#0d1930');
  g.addColorStop(0.72, '#050a13');
  g.addColorStop(1, '#02040a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  g = ctx.createRadialGradient(w * .74, h * .62, 20, w * .74, h * .62, w * .4);
  g.addColorStop(0, 'rgba(36,78,116,.26)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
});

const envTex = canvasTex(1024, 512, (ctx, w, h) => {
  let g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#050a12');
  g.addColorStop(0.42, '#0d1a2c');
  g.addColorStop(0.54, '#1a2b40');
  g.addColorStop(0.72, '#060b14');
  g.addColorStop(1, '#02040a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  ctx.filter = 'blur(26px)';
  const blob = (x, y, rx, ry, color) => {
    const rg = ctx.createRadialGradient(x, y, 0, x, y, Math.max(rx, ry));
    rg.addColorStop(0, color);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(1, ry / rx);
    ctx.translate(-x, -y);
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(x, y, rx, 0, TAU);
    ctx.fill();
    ctx.restore();
  };
  blob(w * 0.16, h * 0.6, 90, 46, 'rgba(255,190,112,.95)');
  blob(w * 0.31, h * 0.55, 54, 26, 'rgba(120,200,255,.8)');
  blob(w * 0.49, h * 0.62, 70, 34, 'rgba(255,240,208,.9)');
  blob(w * 0.61, h * 0.57, 40, 20, 'rgba(255,120,86,.7)');
  blob(w * 0.78, h * 0.6, 66, 28, 'rgba(96,168,255,.55)');
  blob(w * 0.9, h * 0.58, 34, 16, 'rgba(255,160,90,.6)');
  blob(w * 0.08, h * 0.4, 26, 80, 'rgba(90,140,210,.22)');
  ctx.filter = 'none';
});
envTex.mapping = THREE.EquirectangularReflectionMapping;
scene.environment = envTex;

/* ============================================================
   主体纹理
   ============================================================ */
const asphaltTex = canvasTex(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#222a36';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 6000; i++) {
    const v = Math.random();
    ctx.fillStyle = v > .72 ? 'rgba(84,96,114,.22)' : (v > .34 ? 'rgba(20,26,36,.26)' : 'rgba(150,160,172,.055)');
    const s = Math.random() * 2.2 + 0.5;
    ctx.fillRect(Math.random() * w, Math.random() * h, s, s);
  }
  ctx.strokeStyle = 'rgba(12,16,24,.4)';
  ctx.lineWidth = 1.4;
  for (let i = 0; i < 8; i++) {
    ctx.beginPath();
    let x = Math.random() * w, y = Math.random() * h;
    ctx.moveTo(x, y);
    for (let j = 0; j < 5; j++) { x += rand(-38, 38); y += rand(-38, 38); ctx.lineTo(x, y); }
    ctx.stroke();
  }
}, { repeat: [3, 3] });

const asphaltRoughTex = canvasTex(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#a8a8a8';
  ctx.fillRect(0, 0, w, h);
  ctx.filter = 'blur(18px)';
  for (let i = 0; i < 26; i++) {
    const v = Math.random() > .5 ? 'rgba(48,48,48,.85)' : 'rgba(210,210,210,.5)';
    ctx.fillStyle = v;
    ctx.beginPath();
    ctx.ellipse(Math.random() * w, Math.random() * h, rand(24, 90), rand(12, 46), rand(0, TAU), 0, TAU);
    ctx.fill();
  }
  ctx.filter = 'none';
}, { repeat: [3, 3], linear: true });

const concreteTex = canvasTex(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#626b78';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 4200; i++) {
    ctx.fillStyle = Math.random() > .5 ? 'rgba(180,188,198,.10)' : 'rgba(30,36,46,.12)';
    ctx.fillRect(Math.random() * w, Math.random() * h, 1.6, 1.6);
  }
  ctx.strokeStyle = 'rgba(28,34,44,.62)';
  ctx.lineWidth = 3;
  for (let x = 0; x <= w; x += 128) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  for (let y = 0; y <= h; y += 128) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(190,198,206,.08)';
  ctx.lineWidth = 1;
  for (let x = 2; x <= w; x += 128) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  for (let y = 2; y <= h; y += 128) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
}, { repeat: [4, 4] });

const tileFloorTex = canvasTex(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#d8d0c0';
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#b9ad99';
  ctx.lineWidth = 4;
  for (let x = 0; x <= w; x += 128) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  for (let y = 0; y <= h; y += 128) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  for (let i = 0; i < 1200; i++) {
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    ctx.fillRect(Math.random() * w, Math.random() * h, 2, 2);
  }
}, { repeat: [3.2, 3.2] });

/* 便利店招牌 */
const storeSignTex = canvasTex(1024, 224, (ctx, w, h) => {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#fffdf4');
  g.addColorStop(0.7, '#f4f1e4');
  g.addColorStop(1, '#e8e5d8');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  // 星形标志
  const star = (cx, cy, outer, inner, points, fill) => {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const a = -Math.PI / 2 + i * Math.PI / points;
      const r = i % 2 === 0 ? outer : inner;
      ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
  };
  ctx.save();
  ctx.translate(102, 102);
  ctx.rotate(-0.08);
  star(0, 0, 52, 21, 5, '#2d6fbe');
  star(14, -8, 24, 10, 5, '#f6b04e');
  ctx.restore();

  ctx.fillStyle = '#17325f';
  ctx.font = '900 90px "Arial Black", Arial, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillText('HOSHI MART', 186, 102);

  ctx.fillStyle = '#5b6b80';
  ctx.font = '700 24px Arial, sans-serif';
  ctx.fillText('OPEN 24 HOURS   ·   COFFEE   ·   HOT SNACKS', 190, 162);

  const stripes = ['#2b6fd6', '#2fb37d', '#f0a044'];
  stripes.forEach((c, i) => {
    ctx.fillStyle = c;
    ctx.fillRect(0, 192 + i * 11, w, 7);
  });
});

const projSignTex = canvasTex(256, 640, (ctx, w, h) => {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#fffdf5');
  g.addColorStop(1, '#eeeadb');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#d5d0c2';
  ctx.lineWidth = 8;
  ctx.strokeRect(4, 4, w - 8, h - 8);

  ctx.save();
  ctx.translate(128, 104);
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const r = i % 2 === 0 ? 58 : 23;
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath();
  ctx.fillStyle = '#2d6fbe';
  ctx.fill();
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#17325f';
  ctx.font = '900 118px "Arial Black", Arial, sans-serif';
  ctx.fillText('24H', 128, 280);
  ctx.font = '900 62px Arial, sans-serif';
  ctx.fillText('HOSHI', 128, 380);
  ctx.fillText('MART', 128, 448);
  ctx.fillStyle = '#5b6b80';
  ctx.font = '700 22px Arial, sans-serif';
  ctx.fillText('COFFEE · SNACKS', 128, 512);

  ['#2b6fd6', '#2fb37d', '#f0a044'].forEach((c, i) => {
    ctx.fillStyle = c;
    ctx.fillRect(0, h - 56 + i * 14, w, 9);
  });
});

const labelTex = (text, bg = '#f4efdf', fg = '#20314f', sub = '') => canvasTex(512, 160, (ctx, w, h) => {
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(35,52,78,.16)';
  ctx.lineWidth = 6;
  ctx.strokeRect(5, 5, w - 10, h - 10);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = fg;
  ctx.font = '900 74px Arial, sans-serif';
  ctx.fillText(text, w / 2, sub ? 66 : h / 2);
  if (sub) {
    ctx.font = '700 26px Arial, sans-serif';
    ctx.fillStyle = '#7c8798';
    ctx.fillText(sub, w / 2, 120);
  }
});

const coffeeDecalTex = canvasTex(320, 400, (ctx, w, h) => {
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(250,246,231,.96)';
  ctx.beginPath();
  ctx.roundRect(8, 8, w - 16, h - 16, 22);
  ctx.fill();
  ctx.strokeStyle = 'rgba(60,72,80,.15)';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = '#3c2b1f';
  ctx.beginPath();
  ctx.roundRect(76, 78, 138, 118, 12);
  ctx.fill();
  ctx.strokeStyle = '#3c2b1f';
  ctx.lineWidth = 14;
  ctx.beginPath();
  ctx.arc(224, 130, 36, -1.2, 1.2);
  ctx.stroke();
  ctx.fillStyle = '#f2e6d2';
  ctx.fillRect(94, 96, 102, 14);
  ctx.fillStyle = '#d99247';
  ctx.beginPath();
  ctx.roundRect(76, 188, 138, 10, 4);
  ctx.fill();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#5a3c28';
  ctx.font = '900 44px Arial, sans-serif';
  ctx.fillText('HOT', w / 2, 262);
  ctx.fillText('COFFEE', w / 2, 308);
  ctx.fillStyle = '#9a6c4b';
  ctx.font = '700 24px Arial, sans-serif';
  ctx.fillText('FRESH & WARM', w / 2, 348);
});

/* ============================================================
   灯光
   ============================================================ */
scene.add(new THREE.HemisphereLight(0x6f8dbb, 0x0b0f18, 0.72));

const moon = new THREE.DirectionalLight(0xa9c4ef, 1.35);
moon.position.set(10.5, 17, 8);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
moon.shadow.camera.left = -14;
moon.shadow.camera.right = 14;
moon.shadow.camera.top = 14;
moon.shadow.camera.bottom = -14;
moon.shadow.camera.near = 1;
moon.shadow.camera.far = 48;
moon.shadow.bias = -0.0006;
moon.shadow.normalBias = 0.025;
moon.shadow.radius = 1;
scene.add(moon);

const rim = new THREE.DirectionalLight(0x4d6ea8, 0.42);
rim.position.set(-9, 8, -12);
scene.add(rim);

const fillLight = new THREE.DirectionalLight(0x6e93c9, 0.32);
fillLight.position.set(9, 6, 14);
scene.add(fillLight);

/* ============================================================
   底座 / 路面 / 人行道
   ============================================================ */
const baseMat = toon(0x161b26);
const baseTrimMat = toon(0x252b38);
box(18.7, 0.5, 18.7, baseMat, 0, -0.95, 0, { cast: true, receive: true, outline: 1.004 });
box(18.2, 0.7, 18.2, baseTrimMat, 0, -0.35, 0, { cast: true, receive: true, outline: 1.003 });

const plaqueTex = canvasTex(1024, 160, (ctx, w, h) => {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#3b3428');
  g.addColorStop(0.45, '#6d5e42');
  g.addColorStop(1, '#2a261e');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(236,214,164,.5)';
  ctx.lineWidth = 4;
  ctx.strokeRect(18, 18, w - 36, h - 36);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e8d6ae';
  ctx.font = '700 46px Georgia, serif';
  ctx.fillText('H O S H I  M A R T', w / 2, 74);
  ctx.fillStyle = 'rgba(232,214,174,.7)';
  ctx.font = '500 22px Georgia, serif';
  ctx.fillText('1 / 64   ·   RAINY NIGHT   ·   HOSHIMI CITY', w / 2, 116);
});
plane(3.2, 0.42, basic(0xffffff, { map: plaqueTex }), 0, -0.95, 9.361, { ry: Math.PI });

const asphaltMat = new THREE.MeshStandardMaterial({
  map: asphaltTex,
  roughnessMap: asphaltRoughTex,
  roughness: 0.5,
  metalness: 0.42,
  envMapIntensity: 1.15
});
const ground = plane(17.98, 17.98, asphaltMat, 0, 0.005, 0, { rx: -Math.PI / 2, receive: true });

/* 人行道（店主块） */
const sidewalkMat = new THREE.MeshStandardMaterial({
  map: repeatTex(concreteTex, 4.6, 4.0),
  roughness: 0.42,
  metalness: 0.22,
  envMapIntensity: 0.85
});
box(9.9, 0.16, 8.5, sidewalkMat, -4.05, 0.08, -4.75, { cast: false, receive: true });
/* 转角石 */
const curbMat = std(0x8b93a0, { roughness: 0.38, metalness: 0.25 });
box(9.94, 0.05, 0.16, curbMat, -4.05, 0.168, -0.54, { cast: false });
box(0.16, 0.05, 8.44, curbMat, 0.87, 0.168, -4.75, { cast: false });

/* 远侧人行道 */
const farWalkS = new THREE.MeshStandardMaterial({
  map: repeatTex(concreteTex, 8.4, 2.1),
  roughness: 0.44, metalness: 0.2, envMapIntensity: 0.8

function posterTex(hue, hue2, kind = 0) {
  return canvasTex(512, 720, (ctx, w, h) => {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, hue);
    g.addColorStop(1, hue2);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    if (kind % 3 === 0) {
      ctx.fillStyle = 'rgba(255,255,255,.88)';
      ctx.beginPath(); ctx.arc(w * .5, h * .34, 120, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,120,90,.9)';
      ctx.beginPath(); ctx.arc(w * .5, h * .34, 62, 0, TAU); ctx.fill();
    } else if (kind % 3 === 1) {
      ctx.strokeStyle = 'rgba(255,255,255,.8)';
      ctx.lineWidth = 22;
      ctx.beginPath(); ctx.arc(w * .5, h * .35, 110, 0.4, Math.PI * 1.5); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.beginPath(); ctx.arc(w * .5, h * .35, 28, 0, TAU); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.save();
      ctx.translate(w / 2, h * .3);
      ctx.rotate(-0.3);
      ctx.fillRect(-120, -40, 240, 80);
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(255,255,255,.94)';
    ctx.font = '900 62px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(['NEW', 'SALE', 'HOT'][kind % 3], w / 2, h * .62);
    ctx.font = '700 30px Arial';
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.fillText(['SEASONAL ITEM', 'LIMITED TIME', 'FRESH DAILY'][kind % 3], w / 2, h * .69);
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    for (let i = 0; i < 3; i++) ctx.fillRect(110, h * .76 + i * 34, w - 220, 10);
  });
}

const railMat = toon(0xdfe3e2);
function guardRail(x1, x2, z, alongX = true) {
  const g = new THREE.Group();
  world.add(g);
  const len = alongX ? x2 - x1 : x2 - x1;
  const steps = Math.max(2, Math.round(len / 1.7));
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const px = alongX ? x1 + (x2 - x1) * t : x1;
    const pz = alongX ? z : x1 + (x2 - x1) * t;
    cyl(0.035, 0.04, 0.88, 8, railMat, px, 0.16 + 0.44, pz, { parent: g, outline: 1.05 });
    /* 反光片 */
    const ref = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 6), basic(0xff9c48, { toneMapped: false }));
    ref.position.set(px, 0.16 + 0.58, pz + (alongX ? 0.045 : 0.045));
    g.add(ref);
  }
  const y1 = 0.16 + 0.72, y2 = 0.16 + 0.9;
  if (alongX) {
    tube(new THREE.Vector3(x1, y1, z), new THREE.Vector3(x2, y1, z), 0.04, railMat, g, 8);
    tube(new THREE.Vector3(x1, y2, z), new THREE.Vector3(x2, y2, z), 0.04, railMat, g, 8);
  } else {
    tube(new THREE.Vector3(x1, y1, x2), new THREE.Vector3(x1, y1, x2), 0.04, railMat, g);
  }
  return g;
}

function rainBlocked(x, z, y) {
  if (x > -7.95 && x < -0.85 && z > -8.45 && z < -1.85 && y < 3.56) return true;

  const r = ripples.find((r) => !r.active);
  if (!r) return;
  r.active = true;
  r.life = 0;
  r.dur = rand(0.85, 1.35);
  r.max = max;
  r.mesh.position.set(x, y, z);
  r.mesh.scale.setScalar(0.14);
  r.mat.opacity = 0;

function randomWetSpot() {
  if (Math.random() < 0.58) {
    let x = rand(-8.7, 8.7), z = rand(-8.7, 8.7);
    if (x > -7.95 && x < -0.85 && z > -8.45 && z < -1.85) return randomWetSpot();
    const y = (z > 5.4 || x > 5.4) ? 0.176 : (x < 0.9 && z < -0.5 ? 0.176 : 0.032);
    return { x, z, y };
  }
  const p = pick(puddleSpots);
  return { x: p.x + rand(-0.28, 0.28), z: p.z + rand(-0.24, 0.24), y: p.y + 0.004 };
}
let rippleTimer = 0;
onUpdate((dt, t) => {
  for (const r of ripples) {
    if (!r.active) continue;
    r.life += dt;
    const k = r.life / r.dur;
    if (k >= 1) {
      r.active = false;
      r.mesh.visible = false;
      continue;
    }
    const s = 0.14 + k * r.max;
    r.mesh.scale.setScalar(s);
    r.mat.opacity = 0.34 * (1 - k) * (1 - k);
  }
  rippleTimer -= dt;
  if (rippleTimer <= 0) {
    const p = randomWetSpot();
    spawnRipple(p.x, p.z, p.y, rand(0.28, 0.55));
    rippleTimer = rand(0.035, 0.075);
  }
});

const SIGNAL_DIM = 0x221b1a;
const signalCols = [0xe8473f, 0xe6b545, 0x4de0a0];
onUpdate((dt, t) => {
  const cyc = t % 27;
  let state = 0;
  if (cyc >= 10 && cyc < 12.4) state = 1;
  else if (cyc >= 12.4) state = 2;
  for (let i = 0; i < 3; i++) {
    const on = (state === 0 && i === 2) || (state === 1 && i === 1) || (state === 2 && i === 0);
    lensMats[i].color.setHex(on ? signalCols[i] : SIGNAL_DIM);
    lensSprites[i].material.opacity = on ? 0.38 : 0;
  }
  const walk = cyc > 14 && cyc < 24;
  const blink = cyc > 22 ? Math.sin(t * 16) > 0 : true;
  pedGreen.material.color.setHex(walk && blink ? 0x5dffb5 : 0x142a20);
  pedGreenGlow.material.opacity = walk && blink ? 0.4 : 0;
  pedRed.material.color.setHex(!walk ? 0xff5048 : 0x2a1717);
  pedRedGlow.material.opacity = !walk ? 0.4 : 0;
  trafficPoolMat.color.setHex(state === 2 ? 0xe8473f : state === 1 ? 0xe6b545 : 0x4de0a0);
  trafficPoolMat.opacity = 0.07 + 0.02 * Math.sin(t * 2.0);
});

const easeInOut = (x) => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;

onUpdate((dt, t) => {
  /* 自动门 */
  const cyc = t % 17;
  let open = 0;
  if (cyc > 5.5 && cyc < 11.8) {
    const p = cyc - 5.5;
    if (p < 1.2) open = easeInOut(p / 1.2);
    else if (p < 4.0) open = 1;
    else open = 1 - easeInOut(Math.min(1, (p - 4.0) / 1.5));
  }
  doorL.position.x = -4.16 - 0.78 * open;
  doorR.position.x = -3.34 + 0.78 * open;
  sensorLED.material.color.setHex(Math.sin(t * 1.8) > 0 ? 0x6dff9e : 0xff5544);

  /* 招牌轻微闪烁 */
  const ph = t % 21.5;
  let flick = 1;
  if (ph > 18.6 && ph < 18.72) flick = 0.55 + Math.random() * 0.2;
  else if (ph > 18.9 && ph < 18.96) flick = 0.72;
  storeSignMat.color.setScalar((0.95 + 0.03 * Math.sin(t * 21.0)) * flick);
  signGlow.material.opacity = 0.13 * flick;

  const ph2 = (t + 4.2) % 27.0;
  let flick2 = 1;
  if (ph2 > 24.1 && ph2 < 24.26) flick2 = 0.4;
  else if (ph2 > 24.4 && ph2 < 24.52) flick2 = 0.7;
  projMat.color.setScalar((0.94 + 0.04 * Math.sin(t * 13.3)) * flick2);
  projGlow.material.opacity = 0.22 * flick2;
});

/* ============================================================
   尺寸 / 循环
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  controls.update();
  for (let i = 0; i < updaters.length; i++) updaters[i](dt, t);
  composer.render();
});
</script>
</body>
